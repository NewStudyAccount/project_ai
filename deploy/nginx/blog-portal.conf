# blog-portal 静态托管 + /api 反代（blog-content-domain）
# 与 blog-admin 同域多前缀或独立 location 时，按实际域名调整 server_name
# 端口登记见 docs/port-registry.md
server {
    listen 80;
    server_name _;

    # 用户端静态资源
    location / {
        root /usr/share/nginx/html/blog-portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 反代到网关（勿绕过网关直连业务服务）
    location /api/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}

# 前端 SPA 静态容器通用配置（Docker nginx 镜像内 default.conf）
# 生产/测试入口仍由接入层 Nginx 反代，本文件只服务容器内静态资源。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}

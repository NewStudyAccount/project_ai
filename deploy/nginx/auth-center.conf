server {
  listen 80;
  server_name auth.example.local;
  root /srv/auth-portal;
  index index.html;
  location /admin/ { alias /srv/auth-admin/; try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://127.0.0.1:9080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /oauth2/ { proxy_pass http://127.0.0.1:9080; proxy_set_header Host $host; }
}

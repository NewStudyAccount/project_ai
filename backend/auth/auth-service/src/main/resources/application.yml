server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auth_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

auth:
  issuer: auth-service
  # 生产禁止写死密钥：使用环境变量 AUTH_JWT_SECRET 或 Nacos
  jwt-secret: ${AUTH_JWT_SECRET:change-me-local-dev-secret-not-for-prod}
  access-ttl-minutes: 30
  refresh-ttl-days: 7
  sid-ttl-days: 7
  sid-cookie-name: AUTH_SID
  cookie-domain: ""
  login-max-fail: 5
  login-lock-seconds: 300
  return-url-whitelist: "http://localhost,https://localhost"

logging:
  level:
    com.example.auth: info

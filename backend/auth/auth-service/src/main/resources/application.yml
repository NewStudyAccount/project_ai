server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auth_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs

auth:
  issuer: ${AUTH_ISSUER:http://127.0.0.1:8081}
  session-ttl-hours: 12
  access-token-ttl-sec: 600
  refresh-token-ttl-sec: 604800

# 用户中心契约；连接信息以 docs/test-env.md 为准
user-center:
  url: ${USER_CENTER_URL:http://127.0.0.1:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.example.auth: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%X{spanId:-}] %logger{40} - %msg%n"

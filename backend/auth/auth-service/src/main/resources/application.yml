spring:
  application:
    name: auth-service
  profiles:
    active: local
  security:
    oauth2:
      authorizationserver:
        issuer: http://127.0.0.1:9080
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 9080
  error:
    include-message: always
    include-stacktrace: always
    include-binding-errors: always
auth:
  security:
    login-max-failures: 5
    login-lock-seconds: 900
    sso-session-ttl-seconds: 43200
    allowed-origins:
      - http://localhost:5174
      - http://localhost:5175
      - http://127.0.0.1:5174
      - http://127.0.0.1:5175
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

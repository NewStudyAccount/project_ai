spring:
  application:
    name: blog-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis: {}
  servlet:
    multipart:
      # 解除上传大小限制（-1 = 无限）；业务层也不再校验大小
      max-file-size: -1
      max-request-size: -1
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 19100
blog:
  idgen:
    segment-size: 500
  idempotent:
    default-ttl: 24h
  rate-limit:
    upload: 10/min/user
    query: 60/min/user
  object-storage:
    # 引导默认服务商（运行时以 sys_storage_provider 库表为准；公共 yml 不放密钥）
    default-provider: "MIMO"
    providers: []
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - application/pdf
    connect-timeout: 5s
    read-timeout: 30s
  feign:
    connect-timeout: 1s
    read-timeout: 3s
  knowledge:
    # ES 连接（实际节点按 profile 覆盖；仅 knowledge_chunk_v1 一个 index）
    elasticsearch:
      uris: []
      connect-timeout: 5s
      socket-timeout: 30s
      index-name: knowledge_chunk_v1
      top-k: 5
    # 云 API（Embedding/LLM）超时口径；线程池 knowledgeAiExecutor 固化于 framework
    ai:
      connect-timeout: 5s
      embed-read-timeout: 15s
      llm-read-timeout: 60s
      embed-batch-size: 32
    # AI 服务商冷启动引导（运行时以 ai_provider 库表为准；base_url/api_key 由管理端录入或环境注入，禁止明文密钥入仓）
  ai:
    providers: []

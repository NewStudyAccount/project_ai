server:
  port: 9100
spring:
  application:
    name: blog-gateway
  profiles:
    active: local
  cloud:
    gateway:
      routes:
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/api/**
blog-gateway:
  security:
    local-pass-through: true
    jwk-set-uri: ""
    public-paths:
      - /actuator/health
      - /internal/**
    trusted-origins:
      - http://localhost:5100
      - http://127.0.0.1:5100
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

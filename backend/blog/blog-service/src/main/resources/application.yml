spring:
  application:
    name: blog-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis: {}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 19100
blog:
  idgen:
    segment-size: 500
  idempotent:
    default-ttl: 24h
  rate-limit:
    upload: 10/min/user
    query: 60/min/user
  object-storage:
    # 引导默认服务商（运行时以 sys_storage_provider 库表为准；公共 yml 不放密钥）
    default-provider: "MIMO"
    providers: []
    upload-max-bytes: 10485760
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - application/pdf
    connect-timeout: 5s
    read-timeout: 30s
    secret-crypto:
      # SK 加密主密钥来源：环境变量；主密钥本身禁止入仓
      key-source: env
      key-env: OBJECT_STORAGE_SK_KEY
  feign:
    connect-timeout: 1s
    read-timeout: 3s

server:
  port: 8084

spring:
  application:
    name: blog-content-service
  datasource:
    url: jdbc:mysql://192.168.99.100:3306/blog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:192.168.99.100}
      port: ${REDIS_PORT:6379}
      database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
  mapper-locations: classpath:mapper/*.xml

blog:
  auth:
    issuer: auth-service
    jwt-secret: ${AUTH_JWT_SECRET:change-me-local-dev-secret-not-for-prod}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.example.blog: info

server:
  port: 8082

spring:
  application:
    name: file-service
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/file_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health

file:
  auth:
    issuer: auth-service
    # 与 auth 同密钥；生产禁止写死，使用 AUTH_JWT_SECRET 或 Nacos
    jwt-secret: ${AUTH_JWT_SECRET:change-me-local-dev-secret-not-for-prod}
  upload:
    max-size-bytes: 10485760
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
      - application/pdf
      - text/plain
      - text/markdown
      - text/html
  storage:
    # local | minio
    type: ${FILE_STORAGE_TYPE:local}
    bucket: ${FILE_OSS_BUCKET:file-bucket}
    public-base-url: ${FILE_OSS_PUBLIC_BASE_URL:http://127.0.0.1:8082/file/objects/content}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:./data/objects}
    endpoint: ${FILE_OSS_ENDPOINT:http://127.0.0.1:9000}
    # 生产禁止写死密钥：FILE_OSS_ACCESS_KEY / FILE_OSS_SECRET_KEY 或 Nacos
    access-key: ${FILE_OSS_ACCESS_KEY:}
    secret-key: ${FILE_OSS_SECRET_KEY:}

logging:
  level:
    com.example.file: info

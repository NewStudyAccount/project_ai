# 生产：禁止任何密码/密钥；仅非敏感结构，密钥走 Nacos/密钥管理
file:
  storage:
    type: minio
    bucket: ${FILE_OSS_BUCKET:}
    endpoint: ${FILE_OSS_ENDPOINT:}
    access-key: ${FILE_OSS_ACCESS_KEY:}
    secret-key: ${FILE_OSS_SECRET_KEY:}
    public-base-url: ${FILE_OSS_PUBLIC_BASE_URL:}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}

spring:
  datasource:
    url: ${FILE_DB_URL:}
    username: ${FILE_DB_USER:}
    password: ${FILE_DB_PASSWORD:}

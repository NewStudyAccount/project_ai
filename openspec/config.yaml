schema: spec-driven

# 写入 openspec 制品（proposal/design/specs/tasks）时强制注入的项目背景。
# 规范的唯一事实来源是根目录 CLAUDE.md；本文件只做「取用指引 + 自检要求」，
# 不复述契约细节（返回体、错误码、发号构成、配置文件名等一律回 CLAUDE.md 对应章节取），避免双源漂移。
context: |
  必须完整遵守根目录 CLAUDE.md（项目全局规范）。写任何 proposal / design / specs / tasks 或业务代码前，先读取 CLAUDE.md 全文，并对照 §1 项目边界、§2 技术栈、§5 架构、§6 开发规范、§7 协作红线自检。
  契约细节一律以 CLAUDE.md 对应章节为准（统一返回体 §6.4.1、错误码 §6.4.2、审计字段与主键发号 §6.4.5、配置文件 §6.10、幂等限流 §6.11 等），禁止在本制品或变更制品中另立口径。
  各组件 IP/端口/用户名/密码/连接串一律查 docs/test-env.md；密钥分级见 CLAUDE.md §6.7。

rules:
  proposal:
    - 必须写清 Non-goals / 项目边界（对齐 CLAUDE.md §1，防功能蔓延）
    - Impact 不得违反多系统独立边界；跨系统只走显式接口
    - 不得把服务清单/表结构细节写进 CLAUDE.md，结构写在本变更制品
  design:
    - 模块与包结构对齐 CLAUDE.md §5.4–5.6；接口与数据模型对齐 §6.2、§6.5；鉴权对齐 §5.2 双重鉴权模型
    - 配置文件对齐 CLAUDE.md §6.10（application.yml / application-local.yml / application-test.yml）；组件接入信息以 docs/test-env.md 为准
    - 需要替换技术栈时，先改 CLAUDE.md §2 再写入 design，禁止平行框架
  tasks:
    - 任务须可对应 CLAUDE.md §3.2 自检命令（lint / type-check / mvn -q compile）；不以测试命令作提交门禁（§2.2）
    - 不得安排 CLAUDE.md §7.1 反模式清单中的实现（自建返回体/异常/分页、需配置组件进 common、共享 Entity、Controller 调 Mapper、事务内 Feign 等）
    - 含库表变更时，审计字段、主键发号（16 位 yyyyMMdd+日序列，见 §6.4.5）、索引命名对齐 §6.4.5、§6.5
  specs:
    - 需求与验收标准必须可测；禁止只写实现步骤当规格
    - 字段/枚举以后端契约与数据库为准，禁止前端自造枚举值

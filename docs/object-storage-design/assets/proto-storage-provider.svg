  <text x="296" y="508" font-size="11" fill="#3F3F46">· SK 落库密文，接口只回掩码 ****</text>
  <text x="296" y="530" font-size="11" fill="#3F3F46">· 停用：禁止新上传，存量可读/可逻辑删</text>
  <text x="296" y="552" font-size="11" fill="#3F3F46">· 删除：无 deleted=0 文件引用才允许</text>
  <text x="296" y="574" font-size="11" fill="#3F3F46">· 设默认：历史文件仍按 storage_code 回源</text>

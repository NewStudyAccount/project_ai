<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- D-Form 新建/编辑菜单 -->
  <rect width="720" height="640" fill="rgba(15,23,42,0.45)"/>
  <rect x="60" y="36" width="600" height="568" rx="8" fill="#FFFFFF"/>
  <text x="88" y="72" font-size="15" font-weight="600" fill="#0F172A">新建菜单</text>
  <text x="620" y="72" font-size="16" fill="#94A3B8">×</text>

  <text x="88" y="118" font-size="12" fill="#64748B">上级节点</text>
  <rect x="188" y="100" width="440" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="200" y="120" font-size="13" fill="#334155">系统管理 / 菜单管理</text>

  <text x="88" y="166" font-size="12" fill="#64748B">节点类型</text>
  <rect x="188" y="148" width="72" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="208" y="166" font-size="12" fill="#1D4ED8">目录</text>
  <rect x="268" y="148" width="72" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="288" y="166" font-size="12" fill="#64748B">菜单</text>
  <rect x="348" y="148" width="72" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="368" y="166" font-size="12" fill="#64748B">按钮</text>
  <rect x="428" y="148" width="72" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="446" y="166" font-size="12" fill="#64748B">接口点</text>
  <text x="512" y="166" font-size="11" fill="#94A3B8">创建后不可改 type</text>

  <text x="88" y="214" font-size="12" fill="#64748B">菜单名称</text>
  <rect x="188" y="196" width="440" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="200" y="216" font-size="13" fill="#334155">菜单管理</text>

  <text x="88" y="262" font-size="12" fill="#64748B">权限标识</text>
  <rect x="188" y="244" width="440" height="32" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="200" y="264" font-size="12" fill="#CBD5E1">目录可留空 · 非空须 example:xxx 且唯一</text>

  <text x="88" y="310" font-size="12" fill="#64748B">路由地址</text>
  <rect x="188" y="292" width="440" height="32" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="200" y="312" font-size="12" fill="#CBD5E1">菜单必填，如 /menus</text>

  <text x="88" y="358" font-size="12" fill="#64748B">组件标识</text>
  <rect x="188" y="340" width="440" height="32" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="200" y="360" font-size="12" fill="#CBD5E1">菜单必填，如 views/menu/MenuList.vue</text>

  <text x="88" y="406" font-size="12" fill="#64748B">图标 / 排序</text>
  <rect x="188" y="388" width="200" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="200" y="408" font-size="12" fill="#94A3B8">setting</text>
  <rect x="408" y="388" width="120" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="420" y="408" font-size="12" fill="#94A3B8">90</text>

  <text x="88" y="454" font-size="12" fill="#64748B">开关</text>
  <text x="188" y="454" font-size="12" fill="#334155">外链</text>
  <rect x="230" y="442" width="32" height="16" rx="8" fill="#CBD5E1"/>
  <text x="280" y="454" font-size="12" fill="#334155">缓存</text>
  <rect x="322" y="442" width="32" height="16" rx="8" fill="#3B82F6"/><circle cx="346" cy="450" r="6" fill="#fff"/>
  <text x="372" y="454" font-size="12" fill="#334155">隐藏</text>
  <rect x="414" y="442" width="32" height="16" rx="8" fill="#CBD5E1"/>
  <text x="464" y="454" font-size="12" fill="#334155">需认证</text>
  <rect x="520" y="442" width="32" height="16" rx="8" fill="#3B82F6"/><circle cx="544" cy="450" r="6" fill="#fff"/>
  <text x="560" y="454" font-size="12" fill="#334155">启用</text>

  <text x="88" y="502" font-size="12" fill="#64748B">备注</text>
  <rect x="188" y="484" width="440" height="56" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>

  <rect x="460" y="560" width="80" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="482" y="580" font-size="13" fill="#64748B">取消</text>
  <rect x="552" y="560" width="80" height="32" rx="4" fill="#3B82F6"/>
  <text x="576" y="580" font-size="13" fill="#FFFFFF">保存</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 墨岩 · 菜单管理 P-Tree -->
  <rect width="960" height="620" fill="#F1F5F9"/>
  <rect width="200" height="620" fill="#0F172A"/>
  <rect x="200" y="0" width="760" height="56" fill="#FFFFFF"/>
  <line x1="200" y1="56" x2="960" y2="56" stroke="#E2E8F0"/>
  <text x="16" y="32" font-size="14" font-weight="600" fill="#F8FAFC">示例管理端</text>
  <text x="16" y="88" font-size="13" fill="#94A3B8">首页</text>
  <text x="16" y="128" font-size="13" fill="#E2E8F0">系统管理</text>
  <rect x="0" y="148" width="3" height="36" fill="#38BDF8"/>
  <rect x="8" y="148" width="184" height="36" rx="6" fill="rgba(56,189,248,0.12)"/>
  <text x="28" y="171" font-size="13" fill="#E2E8F0">菜单管理</text>
  <text x="28" y="210" font-size="13" fill="#94A3B8">角色管理</text>
  <text x="16" y="250" font-size="13" fill="#94A3B8">业务域</text>
  <text x="220" y="34" font-size="14" font-weight="600" fill="#0F172A">示例管理端</text>
  <text x="820" y="34" font-size="12" fill="#64748B">操作员</text>
  <text x="880" y="34" font-size="12" fill="#3B82F6">退出</text>

  <rect x="220" y="76" width="720" height="524" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="240" y="110" font-size="16" font-weight="600" fill="#0F172A">菜单管理</text>
  <rect x="240" y="126" width="88" height="32" rx="6" fill="#3B82F6"/>
  <text x="262" y="147" font-size="13" fill="#FFFFFF">新建</text>
  <text x="348" y="147" font-size="12" fill="#64748B">展开全部</text>
  <text x="420" y="147" font-size="12" fill="#64748B">折叠</text>

  <rect x="240" y="176" width="680" height="36" fill="#F8FAFC"/>
  <text x="252" y="198" font-size="12" fill="#94A3B8">名称</text>
  <text x="430" y="198" font-size="12" fill="#94A3B8">类型</text>
  <text x="510" y="198" font-size="12" fill="#94A3B8">权限标识</text>
  <text x="660" y="198" font-size="12" fill="#94A3B8">路由</text>
  <text x="750" y="198" font-size="12" fill="#94A3B8">排序</text>
  <text x="800" y="198" font-size="12" fill="#94A3B8">状态</text>
  <text x="860" y="198" font-size="12" fill="#94A3B8">操作</text>

  <!-- rows -->
  <text x="252" y="236" font-size="13" fill="#334155">▾ 系统管理</text>
  <rect x="430" y="222" width="40" height="18" rx="9" fill="#E2E8F0"/><text x="438" y="235" font-size="10" fill="#475569">目录</text>
  <text x="510" y="236" font-size="11" fill="#94A3B8">—</text>
  <text x="750" y="236" font-size="12" fill="#64748B">90</text>
  <rect x="800" y="222" width="36" height="18" rx="9" fill="#DCFCE7"/><text x="808" y="235" font-size="10" fill="#166534">启用</text>
  <text x="856" y="236" font-size="11" fill="#3B82F6">新增子级</text>
  <line x1="240" y1="252" x2="920" y2="252" stroke="#E2E8F0"/>

  <text x="272" y="280" font-size="13" fill="#334155">▾ 菜单管理</text>
  <rect x="430" y="266" width="40" height="18" rx="9" fill="#DBEAFE"/><text x="438" y="279" font-size="10" fill="#1D4ED8">菜单</text>
  <text x="510" y="280" font-size="11" fill="#334155">example:menu:list</text>
  <text x="660" y="280" font-size="11" fill="#64748B">/menus</text>
  <text x="750" y="280" font-size="12" fill="#64748B">1</text>
  <rect x="800" y="266" width="36" height="18" rx="9" fill="#DCFCE7"/><text x="808" y="279" font-size="10" fill="#166534">启用</text>
  <text x="852" y="280" font-size="11" fill="#3B82F6">编辑</text>
  <text x="888" y="280" font-size="11" fill="#EF4444">删除</text>
  <line x1="240" y1="296" x2="920" y2="296" stroke="#E2E8F0"/>

  <text x="292" y="324" font-size="12" fill="#64748B">新建菜单</text>
  <rect x="430" y="310" width="40" height="18" rx="9" fill="#FEF3C7"/><text x="438" y="323" font-size="10" fill="#92400E">按钮</text>
  <text x="510" y="324" font-size="11" fill="#334155">example:menu:create</text>
  <text x="750" y="324" font-size="12" fill="#64748B">1</text>
  <rect x="800" y="310" width="36" height="18" rx="9" fill="#DCFCE7"/><text x="808" y="323" font-size="10" fill="#166534">启用</text>
  <text x="852" y="324" font-size="11" fill="#3B82F6">编辑</text>
  <text x="888" y="324" font-size="11" fill="#EF4444">删除</text>
  <line x1="240" y1="340" x2="920" y2="340" stroke="#E2E8F0"/>

  <text x="292" y="368" font-size="12" fill="#64748B">编辑菜单</text>
  <rect x="430" y="354" width="40" height="18" rx="9" fill="#FEF3C7"/><text x="438" y="367" font-size="10" fill="#92400E">按钮</text>
  <text x="510" y="368" font-size="11" fill="#334155">example:menu:update</text>
  <text x="750" y="368" font-size="12" fill="#64748B">2</text>
  <rect x="800" y="354" width="36" height="18" rx="9" fill="#DCFCE7"/><text x="808" y="367" font-size="10" fill="#166534">启用</text>
  <text x="852" y="368" font-size="11" fill="#3B82F6">编辑</text>
  <text x="888" y="368" font-size="11" fill="#EF4444">删除</text>
  <line x1="240" y1="384" x2="920" y2="384" stroke="#E2E8F0"/>

  <text x="292" y="412" font-size="12" fill="#64748B">删除菜单</text>
  <rect x="430" y="398" width="40" height="18" rx="9" fill="#FEF3C7"/><text x="438" y="411" font-size="10" fill="#92400E">按钮</text>
  <text x="510" y="412" font-size="11" fill="#334155">example:menu:delete</text>
  <text x="750" y="412" font-size="12" fill="#64748B">3</text>
  <rect x="800" y="398" width="36" height="18" rx="9" fill="#DCFCE7"/><text x="808" y="411" font-size="10" fill="#166534">启用</text>
  <text x="852" y="412" font-size="11" fill="#3B82F6">编辑</text>
  <text x="888" y="412" font-size="11" fill="#EF4444">删除</text>
  <line x1="240" y1="428" x2="920" y2="428" stroke="#E2E8F0"/>

  <text x="272" y="456" font-size="13" fill="#334155">角色管理</text>
  <rect x="430" y="442" width="40" height="18" rx="9" fill="#DBEAFE"/><text x="438" y="455" font-size="10" fill="#1D4ED8">菜单</text>
  <text x="510" y="456" font-size="11" fill="#334155">example:role:list</text>
  <text x="660" y="456" font-size="11" fill="#64748B">/roles</text>
  <text x="750" y="456" font-size="12" fill="#64748B">2</text>
  <rect x="800" y="442" width="36" height="18" rx="9" fill="#DCFCE7"/><text x="808" y="455" font-size="10" fill="#166534">启用</text>
  <text x="852" y="456" font-size="11" fill="#3B82F6">编辑</text>
  <text x="888" y="456" font-size="11" fill="#EF4444">删除</text>
  <line x1="240" y1="472" x2="920" y2="472" stroke="#E2E8F0"/>

  <text x="252" y="510" font-size="11" fill="#94A3B8">按钮/接口点仅挂在「菜单」下 · id：目录/菜单按深度段，按钮 90000x，接口点 500x · component 与前端 map 一致</text>
</svg>
